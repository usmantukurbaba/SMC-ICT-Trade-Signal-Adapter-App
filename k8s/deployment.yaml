apiVersion: apps/v1
kind: Deployment
metadata:
  name: smc-ict-adapter
  labels:
    app: smc-ict-adapter
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smc-ict-adapter
  template:
    metadata:
      labels:
        app: smc-ict-adapter
    spec:
      containers:
      - name: smc-ict-adapter
        image: smc-ict-adapter:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: smc-ict-adapter-service
  labels:
    app: smc-ict-adapter
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: smc-ict-adapter
